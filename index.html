<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#174297">
<title>Lagförsäljning</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="bunting" aria-hidden="true" focusable="false"><defs>
  <pattern id="flags" width="120" height="60" patternUnits="userSpaceOnUse">
    <path class="rope" d="M0 6 Q60 38 120 6"/>
    <polygon class="f1" points="10,10.9 30,18 20,44"/><polygon class="f2" points="50,21.5 70,21.5 60,48"/><polygon class="f3" points="90,18 110,10.9 100,44"/>
  </pattern></defs><rect width="100%" height="60" fill="url(#flags)"/></svg>
<header class="topbar">
  <div class="topbar-in">
    <img id="logo" class="crest" src="assets/klubbmarke.png" width="270" height="300" alt="" hidden>
    <span class="pill" id="pill" hidden></span>
    <div class="brandline"><div class="club" id="club"></div><div class="appname" id="apptitle"></div></div>
  </div>
</header>

<main class="page">
  <div id="app"></div>
  <div class="foot" id="foot"></div>
  <noscript>Sidan kräver JavaScript för att kunna ta emot beställningar.</noscript>
</main>

<script src="lag.js"></script>
<script src="util.js"></script>
<script src="app.js"></script>
</body>
</html>
