<text id="tag1" class="t1" x="540" y="760" text-anchor="middle">Lagets försäljning, enkelt.</text>
<text id="tag2" class="t2" x="540" y="850" text-anchor="middle">Har du skramlat?</text>
<rect id="fade" width="1080" height="1080" fill="#16191d" opacity="0"/>
</svg>
<script>
const WW = 5384, CAPH = 686;
const $ = (id) => document.getElementById(id);
const clamp = (x) => Math.max(0, Math.min(1, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeIn = (x) => x * x * x;
const easeInOut = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = (x) => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
// Tidslinje (sekunder)
const FALL = [[0.9, 1.6], [2.3, 2.9], [3.5, 4.1]];   // tre mynt faller ner
const STOR = { s: 9, x: (1080 - 64 * 9) / 2, y: 190 };
const LS = 2.6, LW = (64 + 14 + WW * 32 / CAPH) * LS;
const LITEN = { s: LS, x: (1080 - LW) / 2, y: 470 - 32 * LS };
function render(t) {
  // in: bössan växer fram
  const inn = back(prog(t, 0.0, 0.8));
  // flytt till logga med namn
  const m = easeInOut(prog(t, 5.0, 6.0));
  const s = lerp(STOR.s, LITEN.s, m) * (0.6 + 0.4 * inn), x0 = lerp(STOR.x, LITEN.x, m), y0 = lerp(STOR.y, LITEN.y, m);
  const cx = x0 + 32 * lerp(STOR.s, LITEN.s, m), cy = y0 + 32 * lerp(STOR.s, LITEN.s, m);
  $("sym").setAttribute("transform", `translate(${cx - 32 * s} ${cy - 32 * s}) scale(${s})`);
  $("sym").setAttribute("opacity", clamp(prog(t, 0, 0.35)));
  // mynt som faller, skakning, skrammel, mynt inuti
  let myntY = -40, myntOp = 0, skak = 0, skr = 0;
  FALL.forEach(([a, b], i) => {
    if (t >= a - 0.25 && t < b) { const f = easeIn(prog(t, a, b)); myntY = lerp(-34, 18, f); myntOp = clamp(prog(t, a - 0.25, a)); }
    const efter = t - b;
    if (efter >= 0 && efter < 0.6) { skak += Math.sin(efter * 38) * 6 * (1 - efter / 0.6); skr = Math.max(skr, 1 - efter / 0.6); }
    const inne = $("i" + (i + 1));
    if (t < b) inne.setAttribute("opacity", 0);
    else { const h = prog(t, b, b + 0.35); inne.setAttribute("opacity", 1); inne.setAttribute("transform", `translate(0 ${-6 * Math.sin(h * Math.PI) * (1 - h)})`); }
  });
  // det sista myntet lägger sig överst, som i loggan
  if (t >= 4.3) { const f = easeOut(prog(t, 4.3, 4.8)); myntY = lerp(-14, 0, f); myntOp = f; }
  $("mynt").setAttribute("transform", `translate(0 ${myntY === -40 ? -40 : myntY})`);
  $("mynt").setAttribute("opacity", myntOp);
  $("bossa").setAttribute("transform", `rotate(${skak} 32 58)`);
  const skrVila = clamp(prog(t, 4.5, 4.9));
  const skrNu = Math.max(skr, skrVila);
  $("skr").setAttribute("opacity", skrNu);
  $("skr").setAttribute("transform", `translate(32 12) scale(${0.7 + 0.3 * skrNu + 0.25 * skr * (1 - skrVila)}) translate(-32 -12)`);
  // namnet svepar fram
  const wS = 32 / CAPH * LS, wx = LITEN.x + 78 * LS, wy = 470 + 16 * LS;
  $("ord").setAttribute("transform", `translate(${wx} ${wy}) scale(${wS})`);
  $("wiperect").setAttribute("y", -CAPH * 1.4); $("wiperect").setAttribute("height", CAPH * 1.8);
  $("wiperect").setAttribute("width", WW * 1.02 * easeOut(prog(t, 5.6, 6.6)));
  // texterna
  const t1 = easeOut(prog(t, 6.8, 7.5)), t2 = easeOut(prog(t, 7.7, 8.4));
  $("tag1").setAttribute("opacity", t1); $("tag1").setAttribute("transform", `translate(0 ${20 * (1 - t1)})`);
  $("tag2").setAttribute("opacity", t2); $("tag2").setAttribute("transform", `translate(0 ${20 * (1 - t2)})`);
  // slut: ett litet skrammel och en tonad avslutning
  if (t >= 8.9 && t < 9.4) { const e = t - 8.9; $("bossa").setAttribute("transform", `rotate(${Math.sin(e * 38) * 4 * (1 - e / 0.5)} 32 58)`); }
  $("fade").setAttribute("opacity", easeIn(prog(t, 9.55, 10)));
}
window.render = render; render(0);
</script></body></html>
