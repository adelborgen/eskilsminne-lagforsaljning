<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Swish-test – Skramlat</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../skramlat.css">
<style>
  /* Tillfällig testsida för knappen Öppna Swish. Tas bort när testet är klart. Numret skrivs in på sidan och sparas ingenstans. */
  main { max-width: 520px; margin: 0 auto; padding: 28px 16px 56px; }
  h1 { font: 900 34px/1.05 var(--display); color: var(--kram); margin: 0 0 20px; }
  label { display: block; font-weight: 800; margin: 0 0 6px; }
  input { width: 100%; font: inherit; padding: 14px; border-radius: 14px; border: 2px solid var(--kant); background: var(--kram); color: var(--black); }
  .knapp { display: block; margin-top: 14px; padding: 16px; border-radius: 16px; background: var(--mint); color: var(--black); font: 900 18px/1.2 var(--display); text-decoration: none; text-align: center; }
  .knapp small { display: block; margin-top: 4px; font: 400 13px/1.3 var(--body); word-break: break-all; }
  #lankar[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>Swish-test</h1>
  <label for="nr">Swish-nummer</label>
  <input id="nr" type="tel" inputmode="tel" autocomplete="off" placeholder="07x xxx xx xx eller 123 xxx xx xx">
  <div id="lankar" hidden></div>
</main>
<script>
  (function () {
    var nr = document.getElementById("nr"), ut = document.getElementById("lankar");
    function knapp(namn, href) {
      var a = document.createElement("a"); a.className = "knapp"; a.href = href; a.rel = "noopener";
      a.appendChild(document.createTextNode(namn));
      var s = document.createElement("small"); s.textContent = href; a.appendChild(s);
      return a;
    }
    nr.addEventListener("input", function () {
      var raw = nr.value.replace(/\D/g, "");
      ut.textContent = ""; ut.hidden = true;
      if (!/^(07\d{8}|123\d{7})$/.test(raw)) return;
      var sw = /^07/.test(raw) ? "46" + raw.slice(1) : raw;   // mobilnummer med landskod, Swish-nummer som det är
      var bas = "https://app.swish.nu/1/p/sw/?sw=";
      var data = function (tal) { return encodeURIComponent(JSON.stringify({ version: 1, payee: { value: tal }, amount: { value: 1 }, message: { value: "Test 0001" } })); };
      ut.appendChild(knapp("A. Bara numret", bas + sw));
      ut.appendChild(knapp("B. Numret och 1 kr", bas + sw + "&amt=1.00"));
      ut.appendChild(knapp("C. Numret, 1 kr och meddelande", bas + sw + "&amt=1.00&msg=" + encodeURIComponent("Test 0001")));
      ut.appendChild(knapp("D. Äldre länk, numret med nolla", "swish://payment?data=" + data(raw)));
      ut.appendChild(knapp("E. Äldre länk, numret med 46", "swish://payment?data=" + data(sw)));
      ut.hidden = false;
    });
  })();
</script>
</body>
</html>
